@let name = displayName();
<section class="card p-4 sm:p-5" aria-label="Crea un post">
  <div class="flex items-start gap-3">
    <app-avatar [src]="avatarSrc()" [name]="name" />

    @if (!expanded()) {
      <button
        type="button"
        (click)="expand()"
        class="flex-1 rounded-full border border-slate-200 bg-slate-50 px-4 py-2.5 text-left text-sm text-slate-500 transition hover:border-slate-300 hover:bg-slate-100"
      >
        {{ azienda() ? 'Condividi una novità come ' + name + '…' : 'Cosa vuoi condividere oggi, ' + name.split(' ')[0] + '?' }}
      </button>
    } @else {
      <form [formGroup]="form" (ngSubmit)="publish()" class="min-w-0 flex-1">
        <label for="post-text" class="sr-only">Testo del post</label>
        <textarea
          #textarea
          id="post-text"
          formControlName="contenuto"
          rows="3"
          (input)="autoResize(textarea)"
          (keydown)="onKeydown($event)"
          placeholder="Un nuovo piatto, una novità del locale, una ricerca di personale…"
          class="block max-h-96 min-h-24 w-full resize-none border-0 bg-transparent p-0 text-[0.95rem] leading-relaxed text-slate-900 placeholder:text-slate-400 focus:ring-0 focus:outline-none"
        ></textarea>

        <input #fileInput type="file" [accept]="imageAccept" (change)="onFileSelected(fileInput)" class="hidden" aria-hidden="true" tabindex="-1" />

        @if (uploading()) {
          <div class="mt-3 flex h-40 items-center justify-center gap-2 rounded-xl border border-dashed border-slate-300 bg-slate-50 text-sm font-medium text-slate-500" role="status">
            <svg class="size-5 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3" /><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg>
            Caricamento della foto…
          </div>
        } @else if (mediaPreview(); as url) {
          <div class="relative mt-3 overflow-hidden rounded-xl border border-slate-200 bg-slate-50">
            <img [src]="url" alt="Anteprima della foto" class="max-h-72 w-full object-cover" />
            <button type="button" (click)="removeImage()" class="absolute top-2 right-2 grid size-8 place-items-center rounded-full bg-slate-900/70 text-white hover:bg-slate-900" aria-label="Rimuovi la foto">
              <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
            </button>
          </div>
        }

        <div class="mt-3 flex flex-wrap items-center gap-2 border-t border-slate-100 pt-3">
          <button
            type="button"
            (click)="pickImage()"
            [disabled]="uploading()"
            class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-2 text-sm font-semibold transition hover:bg-slate-100 disabled:opacity-50"
            [class.text-brand-700]="mediaPreview()"
            [class.text-slate-600]="!mediaPreview()"
          >
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21" /></svg>
            {{ mediaPreview() ? 'Cambia foto' : 'Foto' }}
          </button>

          <span class="ml-auto text-xs tabular-nums" [class.text-red-600]="length() > maxLength" [class.text-slate-400]="length() <= maxLength">
            @if (length() > maxLength * 0.8) { {{ length() }}/{{ maxLength }} }
          </span>
          <button type="button" (click)="cancel()" class="rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100">Annulla</button>
          <button type="submit" class="btn-primary !px-4 !py-2" [disabled]="!canPublish()" title="Ctrl/⌘ + Invio">
            @if (publishing()) {
              <svg class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3" /><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg>
            }
            Pubblica
          </button>
        </div>
      </form>
    }
  </div>

  @if (!expanded()) {
    <div class="mt-3 flex gap-1 border-t border-slate-100 pt-2 sm:pl-14">
      <button type="button" (click)="pickImage()" class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-2 text-sm font-semibold whitespace-nowrap text-slate-600 transition hover:bg-slate-100">
        <svg class="size-5 text-sky-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21" /></svg>
        Foto del piatto
      </button>
      <button type="button" (click)="expand()" class="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-2 text-sm font-semibold whitespace-nowrap text-slate-600 transition hover:bg-slate-100">
        <svg class="size-5 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5Z" /></svg>
        Racconta
      </button>
    </div>
  }
</section>

@let p = post();
<article class="card overflow-hidden">
  <header class="flex items-start gap-3 p-4 pb-0 sm:p-5 sm:pb-0">
    <a [routerLink]="['/profile', p.autoreId]" class="shrink-0" [attr.aria-label]="'Profilo di ' + p.autoreName">
      <app-avatar [src]="p.autoreProfilePictureUrl" [name]="p.autoreName" />
    </a>
    <div class="min-w-0 flex-1">
      <a [routerLink]="['/profile', p.autoreId]" class="block truncate text-sm font-semibold hover:text-brand-700 hover:underline">
        {{ p.autoreName }}
      </a>
      @if (p.autoreSommario) {
        <p class="truncate text-xs text-slate-500">{{ p.autoreSommario }}</p>
      }
      <p class="mt-0.5 text-xs text-slate-400">
        <time [attr.datetime]="p.dataCreazione">{{ p.dataCreazione | relativeTime }}</time>
      </p>
    </div>
  </header>

  @if (p.contenuto) {
    <div class="px-4 pt-3 sm:px-5">
      <p class="text-[0.95rem] leading-relaxed break-words whitespace-pre-line text-slate-800">{{ text() }}</p>
      @if (isLong()) {
        <button type="button" (click)="expanded.set(!expanded())" class="mt-1 text-sm font-semibold text-slate-500 hover:text-slate-800">
          {{ expanded() ? 'Mostra meno' : 'Mostra altro' }}
        </button>
      }
    </div>
  }

  @if (p.mediaUrl && !imageBroken()) {
    <div class="mt-3 border-y border-slate-100 bg-slate-50">
      <img
        [src]="p.mediaUrl"
        alt="Foto allegata al post"
        loading="lazy"
        (error)="imageBroken.set(true)"
        class="mx-auto max-h-[32rem] w-full object-cover"
      />
    </div>
  }

  <footer class="flex items-center gap-2 px-2 py-2 sm:px-3" [class.mt-3]="!p.mediaUrl || imageBroken()">
    <button
      type="button"
      (click)="toggleLike()"
      class="group inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold transition hover:bg-slate-100"
      [class.text-rose-600]="p.likedByMe"
      [class.text-slate-600]="!p.likedByMe"
      [attr.aria-pressed]="p.likedByMe"
      [attr.aria-label]="p.likedByMe ? 'Togli mi piace' : 'Mi piace'"
    >
      <svg
        class="size-5 transition-transform duration-200 group-active:scale-125"
        viewBox="0 0 24 24"
        [attr.fill]="p.likedByMe ? 'currentColor' : 'none'"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z" />
      </svg>
      <span>{{ p.likeCount > 0 ? p.likeCount : '' }} Mi piace</span>
    </button>
  </footer>
</article>

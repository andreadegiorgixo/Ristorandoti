<div
  class="fixed inset-0 z-50 grid place-items-end bg-slate-900/50 p-0 backdrop-blur-sm sm:place-items-center sm:p-4"
  (click)="close()"
>
  <div
    class="flex max-h-[85vh] w-full flex-col overflow-hidden rounded-t-2xl bg-white shadow-xl sm:max-w-lg sm:rounded-2xl"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="(isEditing() ? 'Modifica la recensione di ' : 'Scrivi una recensione a ') + userName()"
    (click)="$event.stopPropagation()"
  >
    <header class="flex shrink-0 items-center justify-between border-b border-slate-100 px-5 py-4">
      <h2 class="text-lg font-bold">{{ isEditing() ? 'Modifica la tua recensione' : 'Scrivi una recensione' }}</h2>
      <button
        type="button"
        (click)="close()"
        class="grid size-9 place-items-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-800"
        aria-label="Chiudi"
      >
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>
    </header>

    <form [formGroup]="form" (ngSubmit)="save()" class="min-h-0 flex-1 overflow-y-auto px-5 py-4">
      <p class="text-sm text-slate-500">
        {{ userName() ? 'A ' + userName() : 'A questo utente' }}, per il periodo lavorato insieme.
      </p>

      <div class="mt-4 flex gap-1" role="radiogroup" aria-label="Voto da 1 a 5 stelle">
        @for (n of stars; track n) {
          <button
            type="button"
            (click)="setStar(n)"
            (mouseenter)="hoveredStar.set(n)"
            (mouseleave)="hoveredStar.set(0)"
            [attr.aria-checked]="form.controls.valutazione.value === n"
            role="radio"
            [attr.aria-label]="n + ' su 5 stelle'"
            class="p-0.5"
          >
            <svg
              class="size-8"
              viewBox="0 0 24 24"
              [attr.fill]="n <= (hoveredStar() || form.controls.valutazione.value) ? '#f59e0b' : 'none'"
              stroke="#f59e0b"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01Z" />
            </svg>
          </button>
        }
      </div>

      <label for="review-text" class="mt-4 block text-sm font-semibold text-slate-700">Recensione</label>
      <textarea
        id="review-text"
        formControlName="testo"
        rows="5"
        placeholder="Come hai lavorato con questa persona? Puntualità, professionalità, rapporto con la squadra…"
        class="mt-1.5 block w-full resize-none rounded-xl border border-slate-200 bg-white p-3 text-sm leading-relaxed text-slate-900 placeholder:text-slate-400 focus:border-brand-400 focus:ring-2 focus:ring-brand-100 focus:outline-none"
      ></textarea>
      <span class="mt-1 block text-right text-xs tabular-nums" [class.text-red-600]="length() > maxLength" [class.text-slate-400]="length() <= maxLength">
        {{ length() }}/{{ maxLength }}
      </span>

      <div class="mt-2 flex flex-wrap items-center gap-2 border-t border-slate-100 pt-4">
        @if (isEditing()) {
          <button
            type="button"
            (click)="delete()"
            [disabled]="deleting() || saving()"
            class="rounded-lg px-3 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 disabled:opacity-60"
          >
            {{ deleting() ? 'Eliminazione…' : 'Elimina recensione' }}
          </button>
        }
        <button type="button" (click)="close()" class="ml-auto rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100">Annulla</button>
        <button type="submit" class="btn-primary !px-4 !py-2" [disabled]="!canSave()">
          @if (saving()) {
            <svg class="size-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3" /><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg>
          }
          {{ isEditing() ? 'Salva' : 'Pubblica' }}
        </button>
      </div>
    </form>
  </div>
</div>

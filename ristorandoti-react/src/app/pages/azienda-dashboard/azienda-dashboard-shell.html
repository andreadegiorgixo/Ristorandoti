<div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-6 sm:px-6 lg:flex-row lg:py-8">
  <aside class="lg:w-56 lg:shrink-0">
    <div class="card p-3 lg:sticky lg:top-4">
      <a
        routerLink="/azienda/{{ aziendaId() }}"
        class="mb-2 flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold text-slate-500 transition hover:bg-slate-50 hover:text-slate-800"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6" />
        </svg>
        Visualizza come utente
      </a>
      <nav class="flex flex-row gap-1 overflow-x-auto lg:flex-col lg:overflow-visible" aria-label="Sezioni della Dashboard">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-brand-50 text-brand-700"
            [attr.aria-label]="item.label + (puoiScrivere(item.capability) ? '' : ' (sola lettura)')"
            class="flex shrink-0 items-center justify-between gap-2 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-600 transition hover:bg-slate-50"
          >
            <span>{{ item.label }}</span>
            @if (!puoiScrivere(item.capability)) {
              <span class="rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-bold tracking-wide text-slate-500 uppercase">Sola lettura</span>
            }
          </a>
        }
      </nav>
    </div>
  </aside>

  <main class="min-w-0 flex-1">
    <router-outlet />
  </main>
</div>

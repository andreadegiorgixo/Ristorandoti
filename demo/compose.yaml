name: Ristorandoti

services:
  ristorandoti-database:
    image: 'gvenzl/oracle-free:23-slim-faststart'
    container_name: ristorandoti-database
    environment:
      - 'ORACLE_PASSWORD=SYSTEM'
      - 'APP_USER=ristorandoti'
      - 'APP_USER_PASSWORD=ristorandoti'
    ports:
      - '1521:1521'
    volumes:
      - 'ristorandoti-oracle-data:/opt/oracle/oradata'
    healthcheck:
      test: ['CMD', 'healthcheck.sh']
      interval: 5s
      timeout: 5s
      retries: 10
  ristorandoti-cache:
    image: 'redis:7.4'
    container_name: ristorandoti-cache
    ports:
      - '6379:6379'

volumes:
  ristorandoti-oracle-data:

spring.application.name=ristorandoti

# ===== Server =====
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
spring.threads.virtual.enabled=true

# ===== Datasource (Oracle Free, see compose.yaml) =====
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:ristorandoti}
spring.datasource.password=${DB_PASSWORD:ristorandoti}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===== JPA / Hibernate (schema is owned by Flyway) =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== Redis / Cache =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

# ===== Mail (SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# ===== Security: OAuth2 =====
# Kept commented out: an empty registration/issuer breaks startup. Uncomment once a provider exists.
#spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET}
#spring.security.oauth2.client.registration.google.scope=openid,profile,email
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}

# ===== Accesso con Google (custom, letto da GoogleTokenVerifier) =====
# Client ID OAuth "Applicazione web" della Google Cloud Console (lo stesso usato dal frontend).
# Se vuoto, POST /api/auth/google risponde 503.
app.google.client-id=${GOOGLE_CLIENT_ID:346402964865-jqfj48mnsqctfjia9ic859gr1glvcgqt.apps.googleusercontent.com}

# ===== JWT (custom, letti da JwtService) =====
app.jwt.issuer=ristorandoti
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ===== File upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Upload immagini su disco (letti da FileStorageService, serviti su /uploads/**) =====
app.storage.local.dir=${UPLOAD_DIR:uploads}
# URL pubblico del backend usato negli URL delle immagini; se vuoto si usa quello della richiesta
app.storage.local.public-base-url=${UPLOAD_PUBLIC_BASE_URL:}

# ===== AWS S3 (custom, bind with @ConfigurationProperties("app.storage.s3")) =====
# Credentials come from the AWS default chain (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, ~/.aws, IAM role).
app.storage.s3.bucket=${AWS_S3_BUCKET:ristorandoti-dev}
app.storage.s3.region=${AWS_REGION:eu-south-1}

# ===== Rate limiting (custom, bind with @ConfigurationProperties("app.rate-limit")) =====
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
app.rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:100}
app.rate-limit.refill-period=${RATE_LIMIT_REFILL_PERIOD:1m}

# ===== Rate limiting degli endpoint di tracciamento metriche (bucket dedicato, più stretto) =====
app.rate-limit.tracking.capacity=${RATE_LIMIT_TRACKING_CAPACITY:30}
app.rate-limit.tracking.refill-tokens=${RATE_LIMIT_TRACKING_REFILL_TOKENS:30}
app.rate-limit.tracking.refill-period=${RATE_LIMIT_TRACKING_REFILL_PERIOD:1m}

# ===== Dashboard aziendale: decisioni configurabili (vedi DashboardProperties) =====
app.dashboard.job-duration-days=${JOB_DURATION_DAYS:7}
app.dashboard.job-expired-retention-days=${JOB_EXPIRED_RETENTION_DAYS:7}
app.dashboard.max-offerte-attive=${MAX_OFFERTE_ATTIVE:3}
app.dashboard.overview-max-length=${OVERVIEW_MAX_LENGTH:4000}
app.dashboard.page-settings-requires-manage-permissions=${PAGE_SETTINGS_REQUIRES_MANAGE_PERMISSIONS:true}
app.dashboard.post-soft-delete-purge-days=${POST_SOFT_DELETE_PURGE_DAYS:0}
app.dashboard.search-metric-mode=${SEARCH_METRIC_MODE:APPEARANCE}
app.dashboard.view-dedup-ttl-hours=${VIEW_DEDUP_TTL_HOURS:48}
app.dashboard.enforce-last-admin-guard=${ENFORCE_LAST_ADMIN_GUARD:true}

# ===== CORS (custom) =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}

# ===== OpenAPI / Swagger =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ===== Logging =====
logging.level.root=INFO
logging.level.com.ristorandoti=${LOG_LEVEL:DEBUG}